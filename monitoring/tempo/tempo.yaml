stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 168h

backend_worker:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: s3
    s3:
      endpoint: minio:9000
      bucket: nestblogtraces
      access_key: ${MINIO_ACCESS_KEY}
      secret_key: ${MINIO_SECRET_KEY}
      insecure: true
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
